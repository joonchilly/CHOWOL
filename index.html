/* Layout: a phone-width photo-sharing app — top bar, scrolling screen, bottom tab bar (홈 · 만들기 · 메시지 · 프로필). One dark world from the intro film: lamp-black ground, paper text, subtitle-gold accent, red only for a given heart. */
:root {
  --bg: #0B0A09;
  --surface: #161411;
  --raise: #201D19;
  --ink: #EFE9DD;
  --muted: #9A9183;
  --line: #2A2722;
  --accent: #F2C94C;
  --on-accent: #15130F;
  --heart: #ED4956;
  --water: #3E86A8;
  --logo: #5B8FD0;
  --r: 14px;
  --fs: 16px;
  --bubble: var(--accent);
  --on-bubble: var(--on-accent);
  --ratio: auto;
  --danger: #E57A62;
  --font-display: "Do Hyeon", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-body: "Do Hyeon", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: var(--fs); line-height: 1.5; font-synthesis: none; letter-spacing: .01em; }
* { font-weight: 400 !important; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
button:disabled { cursor: default; opacity: .5; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
img { max-width: 100%; }
[hidden] { display: none !important; }
html.standalone, html.standalone body { height: var(--appH, 100%); }
html.standalone .intro, html.standalone .gate, html.standalone .modal { bottom: auto; height: var(--appH, 100%); }
html, body { overscroll-behavior: none; -webkit-text-size-adjust: 100%; }
button, a, label { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
button:active { transform: scale(.94); transition: transform .08s; }
.media { touch-action: manipulation; }
body { -webkit-user-select: none; user-select: none; }
input, textarea, .cap, .cm .txt, .bubble, .prof-bio { -webkit-user-select: text; user-select: text; }
@media (max-width: 480px) { .app { border: 0; } body .modal { padding: 0; place-items: end stretch; } body .modal .sheet { max-width: none; border-radius: var(--r) var(--r) 0 0; max-height: 92dvh; padding-bottom: env(safe-area-inset-bottom, 0px); } }
/* toasts & activity */
.toasts { position: fixed; top: calc(8px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); width: min(460px, calc(100% - 16px)); z-index: 35; display: flex; flex-direction: column; gap: 6px; pointer-events: none; }

.icon-btn { position: relative; padding: 4px; border-radius: 8px; }
.dot { position: absolute; top: 0; right: -2px; min-width: 18px; height: 18px; border-radius: 9px; background: var(--heart); color: #fff; font-size: 11px; font-weight: 600; display: grid; place-items: center; padding: 0 5px; border: 2px solid var(--bg); font-variant-numeric: tabular-nums; }

/* avatars */
.av { width: 32px; height: 32px; border-radius: 50%; overflow: hidden; display: inline-grid; place-items: center; background: var(--raise); color: var(--accent); font-weight: 600; font-size: 13px; flex: none; }

.likes { font-weight: 600; }
.cap { white-space: pre-wrap; word-break: break-word; }

.more-c { color: var(--muted); text-align: left; }
.cm { display: flex; gap: 6px; align-items: flex-start; word-break: break-word; }
.cm .txt { flex: 1; min-width: 0; white-space: pre-wrap; }

.c-form { display: flex; gap: 10px; align-items: center; padding: 8px 14px 0; }
.c-form input { flex: 1; min-width: 0; background: transparent; border: 0; outline: none; padding: 6px 0; }

.menu { display: flex; gap: 8px; align-items: center; }
.danger { color: var(--danger); font-weight: 600; font-size: 13px; }

/* DM */
.inbox-h { padding: 14px 16px 6px; font-weight: 600; font-size: 15px; }
.thread-row { display: flex; align-items: center; gap: 12px; padding: 9px 16px; width: 100%; text-align: left; }

.msgs { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 14px 12px; display: flex; flex-direction: column; gap: 2px; }

.dm-form { display: flex; align-items: center; gap: 8px; margin: 8px 12px calc(10px + env(safe-area-inset-bottom, 0px)); border: 1px solid var(--line); border-radius: 24px; padding: 4px 6px 4px 16px; background: var(--surface); }

.attach-menu { display: flex; gap: 8px; flex-wrap: wrap; padding: 6px 12px 0; }
.attach-menu button { display: flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 15px; }

.notice-bar { display: flex; gap: 10px; align-items: center; margin: 8px 12px 0; padding: 10px 12px; background: var(--raise); border: 1px solid var(--line); border-radius: var(--r); text-align: left; color: var(--ink); }

/* intro */
.intro { position: fixed; inset: 0; z-index: 40; background: #000; display: grid; place-items: center; transition: opacity .9s ease; }

.ripple { position: absolute; left: 50%; top: calc(50% + min(19vw, 90px) * 1.27 + 10px); width: min(44vw, 210px); height: min(9vw, 42px); margin-left: calc(min(44vw, 210px) / -2); border: 2px solid var(--logo); border-radius: 50%; opacity: 0; transform: scale(.2); }
.intro.splashing video { opacity: 0; }

<body>
<div class="intro" id="intro" aria-label="인트로 영상">

<div class="modal" id="themeModal" hidden role="dialog" aria-modal="true" aria-labelledby="themeTitle">

      <div class="theme-sec" style="border-top:1px solid var(--line);padding-top:14px">
        <span>들어올 수 있는 친구 (구글 이메일)</span>

      </div>
    </div>
  </div>

const auth = initializeAuth(app, { persistence: [indexedDBLocalPersistence, browserLocalPersistence], popupRedirectResolver: browserPopupRedirectResolver });
const fs = getFirestore(app);

const mapErr = (e) => {
  const c = (e && e.code) || "";
  if (c === "permission-denied") return { code: "invalid_argument", message: e.message };
  if (c === "unavailable" || c === "deadline-exceeded") return { code: "unavailable", message: e.message };
  if (c === "resource-exhausted") return { code: "resource_exhausted", message: e.message };

const wrapDoc = (s) => ({ id: s.id, exists: s.exists(), data: () => s.data(), metadata: s.metadata });
const wrapQ = (q) => ({ docs: q.docs.map(wrapDoc), size: q.size, empty: q.empty, metadata: q.metadata, docChanges: () => q.docChanges() });
function flatten(o, pre = "", out = {}) {
  for (const [k, v] of Object.entries(o)) {
    const key = pre ? pre + "." + k : k;
    if (v && typeof v === "object" && !Array.isArray(v) && Object.getPrototypeOf(v) === Object.prototype && Object.keys(v).length) flatten(v, key, out);

    get: () => guard(getDoc(ref)).then(wrapDoc),
    set: (data) => guard(setDoc(ref, data)),
    update: (data) => guard(updateDoc(ref, flatten(data))),
    delete: () => guard(deleteDoc(ref)),
    onSnapshot: (n, e) => onSnapshot(ref, (s) => n(wrapDoc(s)), (x) => e && e(mapErr(x))),

}
class Q {
  constructor(path, cons = []) { this.path = path; this.cons = cons; }
  where(f, o, v) { return new Q(this.path, [...this.cons, where(f, o, v)]); }
  orderBy(f, d) { return new Q(this.path, [...this.cons, orderBy(f, d || "asc")]); }
  limit(n) { return new Q(this.path, [...this.cons, limit(n)]); }

// 사진·동영상: Firestore 문서 하나는 1MB까지라서 900KB 조각으로 나눠 저장하고, 볼 때 다시 합친다
const mediaCache = new Map();
const chunkPath = (id, i) => "media/" + id + "/c/" + String(i).padStart(4, "0");
window.__media = {
  async put(blob, onProg) {
    const id = doc(collection(fs, "media")).id;
    const buf = new Uint8Array(await blob.arrayBuffer());
    const CH = 900 * 1024, n = Math.max(1, Math.ceil(buf.length / CH));
    for (let i = 0; i < n; i++) {
      await setDoc(doc(fs, chunkPath(id, i)), { d: Bytes.fromUint8Array(buf.subarray(i * CH, (i + 1) * CH)) });
      if (onProg) onProg((i + 1) / n);
    }
    await setDoc(doc(fs, "media/" + id), { type: blob.type || "application/octet-stream", size: buf.length, n, ts: Date.now() });
    return id;
  },
  url(id) {
    if (mediaCache.has(id)) return mediaCache.get(id);
    const p = (async () => {
      const m = await getDoc(doc(fs, "media/" + id));
      if (!m.exists()) throw new Error("missing");
      const meta = m.data();
      const parts = await Promise.all(Array.from({ length: meta.n }, (_, i) => getDoc(doc(fs, chunkPath(id, i))).then((c) => c.data().d.toUint8Array())));
      return URL.createObjectURL(new Blob(parts, { type: meta.type }));
    })();
    p.catch(() => mediaCache.delete(id));
    mediaCache.set(id, p);
    return p;
  }
};

    if (e && (e.code === "auth/popup-blocked" || e.code === "auth/operation-not-supported-in-this-environment")) { await signInWithRedirect(auth, prov); return; }

}

  started = true; gate.hidden = true;

  // ---------- modals ----------
  function closeModal(id) { $("#" + id).hidden = true; if (id === "postModal") ui.openPost = null; }
  document.querySelectorAll("[data-close]").forEach((b) => b.addEventListener("click", () => closeModal(b.dataset.close)));
  document.querySelectorAll(".modal").forEach((m) => m.addEventListener("click", (e) => { if (e.target === m) closeModal(m.id); }));
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") document.querySelectorAll(".modal:not([hidden])").forEach((m) => closeModal(m.id)); });

  // images
  async function loadBitmap(file) {
    try { return await createImageBitmap(file, { imageOrientation: "from-image" }); }
    catch { return await new Promise((res, rej) => { const img = new Image(); img.onload = () => res(img); img.onerror = rej; img.src = URL.createObjectURL(file); }); }
  }
  function toCanvas(bmp, max) {
    const w = bmp.width, hh = bmp.height, s = Math.min(1, max / Math.max(w, hh));
    const c = document.createElement("canvas"); c.width = Math.max(1, Math.round(w * s)); c.height = Math.max(1, Math.round(hh * s));
    const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(bmp, 0, 0, c.width, c.height);
    return c;
  }
  async function prepareImage(file, big, small) {
    const bmp = await loadBitmap(file);
    if (assets) {
      try { const blob = await new Promise((r) => toCanvas(bmp, big).toBlob(r, "image/jpeg", 0.85)); const res = await assets.upload(blob, { type: "image/jpeg" }); return { id: res.id }; } catch {}
    }
    let max = big === 600 ? 400 : 1280, q = 0.75, url = "";
    for (let i = 0; i < 6; i++) { url = toCanvas(bmp, max).toDataURL("image/jpeg", q); if (url.length < (big === 600 ? 120000 : 600000)) break; max = Math.round(max * 0.8); q = Math.max(0.5, q - 0.05); }
    return { data: url };
  }

  // create
  function openCreate() { if (readOnly || !myId) return; $("#createModal").hidden = false; $("#createText").focus(); }
  $("#navCreate").addEventListener("click", openCreate);
  $("#createPhoto").addEventListener("change", (e) => {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    ui.createFile = f; $("#pickImg").src = URL.createObjectURL(f); $("#pickImg").hidden = false; $("#pickHint").hidden = true;
  });
  $("#createForm").addEventListener("submit", async (e) => {
    e.preventDefault(); if (!myId) return;
    const text = $("#createText").value.trim();
    if (!text && !ui.createFile) { $("#createText").focus(); return; }
    const btn = $("#createBtn"); btn.disabled = true; btn.textContent = "올리는 중";
    try {
      const body = { author: myId, text, ts: Date.now(), reactions: {} };
      if (ui.createFile) { const r = await prepareImage(ui.createFile, 1600, 1000); if (r.id) body.image = r.id; else body.imageData = r.data; }
      const ok = await write(() => db.collection("posts").add(body));
      if (ok) {
        e.target.reset(); ui.createFile = null; $("#pickImg").hidden = true; $("#pickImg").removeAttribute("src"); $("#pickHint").hidden = false;
        closeModal("createModal"); go("home"); $("#homeScroll").scrollTop = 0;
      }
    } catch { notice("사진을 처리하지 못했어요. 다른 사진으로 시도해 주세요."); }
    btn.disabled = false; btn.textContent = "공유";
  });

  // edit profile
  function openEdit() {
    if (readOnly || !myId) return;
    const m = S.members[myId] || {};
    $("#editNick").value = m.nick || (S.profiles[myId] && S.profiles[myId].name) || "";
    $("#editBio").value = m.bio || "";
    ui.editFile = null; $("#editAv").replaceChildren(avatar(myId));
    $("#editModal").hidden = false; $("#editNick").focus();
  }
  $("#editCancel").addEventListener("click", () => { closeModal("editModal"); store("chowol.askedName", "1"); });
  $("#editPhoto").addEventListener("change", (e) => {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    ui.editFile = f; const img = h("img", { alt: "" }); img.src = URL.createObjectURL(f);
    $("#editAv").replaceChildren(h("span", { class: "av" }, img));
  });
  $("#editForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const nick = $("#editNick").value.trim(); if (!nick) return;
    const btn = $("#editSave"); btn.disabled = true;
    const prev = S.members[myId] || {};
    const doc = { nick, bio: $("#editBio").value.trim(), joined: prev.joined || Date.now() };
    if (prev.photo) doc.photo = prev.photo;
    if (prev.photoData) doc.photoData = prev.photoData;
    try {
      if (ui.editFile) { const r = await prepareImage(ui.editFile, 600, 360); delete doc.photo; delete doc.photoData; if (r.id) doc.photo = r.id; else doc.photoData = r.data; }
      const ok = await write(() => db.doc("members/" + myId).set(doc));
      if (ok) { closeModal("editModal"); $("#editPhoto").value = ""; }
    } catch { notice("사진을 처리하지 못했어요. 다른 사진으로 시도해 주세요."); }
    btn.disabled = false;
  });

  // ---------- navigation ----------
  const SCREENS = ["home", "dm", "profile"];
  function show(s) {
    if (!SCREENS.includes(s)) s = "home";
    ui.screen = s; ui.menu = null;
    SCREENS.forEach((x) => { $("#s-" + x).hidden = x !== s; });
    renderAll();
  }
  function go(s, keepState) {
    if (!keepState) { if (s === "dm") ui.thread = null; if (s === "profile") ui.profileId = null; }
    if (location.hash !== "#" + s) location.hash = s; else show(s);
  }
  document.querySelectorAll("[data-go]").forEach((b) => b.addEventListener("click", () => go(b.dataset.go)));
  $("#homeDm").addEventListener("click", () => go("dm"));
  window.addEventListener("hashchange", () => show(location.hash.slice(1)));
  show(location.hash.slice(1) || "home");

  // ---------- theme (owner edits live, everyone sees it) ----------
  const PRESETS = {
    ink: { label: "먹색", bg: "#0B0A09", surface: "#161411", raise: "#201D19", ink: "#EFE9DD", muted: "#9A9183", line: "#2A2722", scheme: "dark" },
    sea: { label: "깊은 바다", bg: "#06121A", surface: "#0D1D27", raise: "#152A37", ink: "#E6F0F5", muted: "#8DA5B3", line: "#1F3644", scheme: "dark" },
    wood: { label: "밤 나무", bg: "#140F0B", surface: "#1F1812", raise: "#2B2119", ink: "#F2E8DA", muted: "#A8977F", line: "#3A2D22", scheme: "dark" },
    paper: { label: "밝은 종이", bg: "#F4F1EA", surface: "#FFFFFF", raise: "#ECE7DD", ink: "#1C1A16", muted: "#6B6458", line: "#DDD6C8", scheme: "light" }
  };
  const ACCENTS = ["#F2C94C", "#5B8FD0", "#ED4956", "#7BC8A4", "#F28C38", "#B58CF0", "#EFE9DD"];
  const RATIOS = { auto: "원본", "1 / 1": "정사각형", "4 / 5": "세로 4:5" };
  const THEME_DEFAULT = { preset: "ink", accent: "#F2C94C", logo: "#5B8FD0", bubble: "accent", fs: 16, radius: 14, ratio: "auto", name: "초월", stories: true };
  const HEX = /^#[0-9a-fA-F]{6}$/;
  function cleanTheme(t) {
    t = t || {}; const d = THEME_DEFAULT; const num = (v, lo, hi, df) => (typeof v === "number" && isFinite(v)) ? Math.min(hi, Math.max(lo, Math.round(v))) : df;
    return {
      preset: PRESETS[t.preset] ? t.preset : d.preset,
      accent: HEX.test(t.accent) ? t.accent : d.accent,
      logo: HEX.test(t.logo) ? t.logo : d.logo,
      bubble: t.bubble === "logo" ? "logo" : "accent",
      fs: num(t.fs, 13, 21, d.fs), radius: num(t.radius, 0, 28, d.radius),
      ratio: RATIOS[t.ratio] ? t.ratio : d.ratio,
      name: (typeof t.name === "string" && t.name.trim()) ? t.name.trim().slice(0, 12) : d.name,
      stories: t.stories !== false
    };
  }
  function onColor(hex) {
    const n = parseInt(hex.slice(1), 16), r = (n >> 16) / 255, g = (n >> 8 & 255) / 255, b = (n & 255) / 255;
    const L = (c) => c <= .03928 ? c / 12.92 : Math.pow((c + .055) / 1.055, 2.4);
    return (0.2126 * L(r) + 0.7152 * L(g) + 0.0722 * L(b)) > 0.35 ? "#15130F" : "#FFFFFF";
  }
  let theme = (() => { try { return cleanTheme(JSON.parse(store("chowol.theme") || "{}")); } catch { return cleanTheme({}); } })();
  function applyTheme(t) {
    const P = PRESETS[t.preset], s = document.documentElement.style;
    ["bg", "surface", "raise", "ink", "muted", "line"].forEach((k) => s.setProperty("--" + k, P[k]));
    s.setProperty("color-scheme", P.scheme);
    s.setProperty("--accent", t.accent); s.setProperty("--on-accent", onColor(t.accent));
    s.setProperty("--logo", t.logo);
    const bc = t.bubble === "logo" ? t.logo : t.accent;
    s.setProperty("--bubble", bc); s.setProperty("--on-bubble", onColor(bc));
    s.setProperty("--fs", t.fs + "px"); s.setProperty("--r", t.radius + "px"); s.setProperty("--ratio", t.ratio);
    const nm = document.querySelector(".logo span"); if (nm) nm.textContent = t.name;
    document.body.classList.toggle("no-stories", !t.stories);
    const meta = document.querySelector('meta[name="theme-color"]'); if (meta) meta.content = P.bg;
  }
  applyTheme(theme);
  let themeDirty = false, themeTimer = null;
  function setTheme(patch) {
    theme = cleanTheme({ ...theme, ...patch }); applyTheme(theme); store("chowol.theme", JSON.stringify(theme)); fillTheme();
    themeDirty = true; $("#thStatus").textContent = "저장 중…";
    clearTimeout(themeTimer);
    themeTimer = setTimeout(async () => {
      const snapshot = theme;
      const ok = await write(() => db.doc("config/theme").set(snapshot));
      themeDirty = false;
      $("#thStatus").textContent = ok ? "저장했어요. 친구들 화면에도 적용됐어요." : "저장하지 못했어요. 다시 바꿔보세요.";
    }, 600);
  }
  function chipRow(box, items, current, pick) {
    $(box).replaceChildren(...items.map(([val, label, dot]) => h("button", { type: "button", class: dot && !label ? "sw" : "chip-btn", "aria-pressed": String(val === current), "aria-label": label || val, style: dot && !label ? "background:" + dot : null, onclick: () => pick(val) },
      dot && label ? h("span", { class: "preset-dot", style: "background:" + dot }) : null, label || null)));
  }
  function fillTheme() {
    if ($("#themeModal").hidden) return;
    chipRow("#thPreset", Object.entries(PRESETS).map(([k, p]) => [k, p.label, p.bg]), theme.preset, (v) => setTheme({ preset: v }));
    const colorRow = (box, key) => {
      chipRow(box, ACCENTS.map((c) => [c, "", c]), theme[key], (v) => setTheme({ [key]: v }));
      const inp = h("input", { type: "color", class: "color-in", "aria-label": "직접 고르기", value: theme[key] });
      inp.addEventListener("change", () => setTheme({ [key]: inp.value }));
      $(box).append(inp);
    };
    colorRow("#thAccent", "accent"); colorRow("#thLogo", "logo");
    chipRow("#thBubble", [["accent", "포인트 색", theme.accent], ["logo", "로고 색", theme.logo]], theme.bubble, (v) => setTheme({ bubble: v }));
    chipRow("#thRatio", Object.entries(RATIOS), theme.ratio, (v) => setTheme({ ratio: v }));
    chipRow("#thStories", [[true, "보이기"], [false, "숨기기"]], theme.stories, (v) => setTheme({ stories: v }));
    $("#thFs").value = theme.fs; $("#thFsOut").textContent = theme.fs + "px";
    $("#thR").value = theme.radius; $("#thROut").textContent = theme.radius + "px";
    if (document.activeElement !== $("#thName")) $("#thName").value = theme.name;
  }
  let invUnsub = null, invited = [];
  function renderInv() {
    $("#invList").replaceChildren(...(invited.length ? invited.map((em) => h("div", { class: "cm", style: "align-items:center" },
      h("span", { class: "txt", text: em }), h("button", { type: "button", class: "del", text: "빼기", onclick: () => write(() => db.doc("allow/" + em).delete()) }))) : [h("span", { class: "linkish", text: "아직 초대한 친구가 없어요." })]));
  }
  function openTheme() {
    if (!isOwner) return; $("#themeModal").hidden = false; $("#thStatus").textContent = ""; fillTheme();
    if (!invUnsub && db) invUnsub = db.collection("allow").onSnapshot((s) => { invited = s.docs.map((d) => d.id).sort(); renderInv(); }, () => {});
    renderInv();
  }
  $("#invForm").addEventListener("submit", async (e) => {
    e.preventDefault(); const em = $("#invEmail").value.trim().toLowerCase();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) { $("#thStatus").textContent = "이메일 주소를 확인해 주세요."; return; }
    const ok = await write(() => db.doc("allow/" + em).set({ ts: Date.now() }));
    if (ok) { $("#invEmail").value = ""; $("#thStatus").textContent = em + " 님을 초대했어요. 이제 이 구글 계정으로 들어올 수 있어요."; }
  });
  $("#logoutBtn").addEventListener("click", () => { if (window.__signOut) window.__signOut(); });
  $("#thFs").addEventListener("input", (e) => { $("#thFsOut").textContent = e.target.value + "px"; setTheme({ fs: Number(e.target.value) }); });
  $("#thR").addEventListener("input", (e) => { $("#thROut").textContent = e.target.value + "px"; setTheme({ radius: Number(e.target.value) }); });
  $("#thName").addEventListener("input", (e) => setTheme({ name: e.target.value }));
  $("#themeReset").addEventListener("click", () => setTheme({ ...THEME_DEFAULT }));

  // ---------- intro: film, then waves ----------
  (function intro() {
    const ov = $("#intro"), v = $("#introVideo");
    let stage = "film";
    const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
    function leave(delay) {
      if (stage === "gone") return; stage = "gone";
      setTimeout(() => { ov.classList.add("out"); setTimeout(() => ov.remove(), 950); }, delay);
    }
    function waves() {
      if (stage !== "film") return; stage = "splash"; $("#introPlay").hidden = true;
      ov.classList.add("splashing");
      setTimeout(() => leave(0), 1500);
    }
    v.addEventListener("ended", waves);
    v.addEventListener("error", waves);
    // always with sound: try to start unmuted; if the browser refuses, wait for one tap
    v.muted = false; v.volume = 1;
    $("#introPlay").addEventListener("click", (e) => { e.currentTarget.hidden = true; v.muted = false; v.currentTime = 0; v.play().catch(waves); });
    const p = v.play(); if (p && p.catch) p.catch(() => { v.pause(); $("#introPlay").hidden = false; });
  })();

  // ---------- connect ----------
  let loadTimer = null;
  function listen(key, query, assign) {
    return query.onSnapshot((snap) => {
      assign(snap);
      if (!snap.metadata.fromCache) { S.loaded[key] = true; if (loadTimer) { clearTimeout(loadTimer); loadTimer = null; } }
      else if (snap.size) S.loaded[key] = true;
      schedule();
    }, (err) => { S.loaded[key] = true; schedule(); if (err && err.code !== "revoked") notice("데이터를 불러오지 못했어요. 페이지를 다시 열어 주세요."); });
  }
  (async () => {
    if (!window.claude || typeof window.claude.use !== "function") { renderAll(); return; }
    [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if (!db) { notice("연결하지 못했어요. 페이지를 다시 열어 주세요."); renderAll(); return; }
    if (user) {
      const me = await user.me(); myId = me.id; isOwner = me.isOwner;
      if ((await user.can("data.write")) === false) setReadOnly();
    }
    if (!myId) setReadOnly();
    try { assets = await claude.use("assets"); } catch { assets = null; }
    loadTimer = setTimeout(() => notice("아직 초월에 연결되지 않았어요. 인터넷 연결을 확인해 주세요."), 10000);
    listen("posts", db.collection("posts").orderBy("ts", "desc").limit(100), (s) => { S.posts = s.docs; });
    listen("comments", db.collection("comments").orderBy("ts", "desc").limit(800), (s) => { S.comments = s.docs; });
    listen("chat", db.collection("chat").orderBy("ts", "desc").limit(300), (s) => { S.chat = s.docs; });
    listen("notices", db.collection("notices").orderBy("ts", "desc").limit(20), (s) => { S.notices = s.docs; if (!$("#noticeModal").hidden) renderNoticeList(); });
    if (myId) listen("dm", db.collection("dm").where("members", "array-contains", myId).limit(500), (s) => { S.dm = s.docs; });
    db.doc("config/theme").onSnapshot((snap) => {
      if (themeDirty) return;
      theme = cleanTheme(snap.exists ? snap.data() : {}); applyTheme(theme); store("chowol.theme", JSON.stringify(theme)); fillTheme();
    }, () => {});
    listen("members", db.collection("members").limit(50), (s) => {
      const m = {}; s.docs.forEach((d) => { m[d.id] = d.data(); }); S.members = m;
      if (!s.metadata.fromCache && myId && !readOnly && !(m[myId] && m[myId].nick) && !store("chowol.askedName")) setTimeout(openEdit, 4500);
    });
  })();
})();
</script>
</body>
</html>
